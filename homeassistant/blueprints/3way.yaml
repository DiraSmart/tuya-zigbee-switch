blueprint:
  name: 3-way — una luz desde varias teclas
  description: >-
    Varias teclas manejan la misma luz, y el LED de cada una refleja el estado
    real de esa luz.

    Una automatización por LUZ, no por tecla: se eligen todas las teclas juntas.
    La luz principal puede ser un relé Zigbee o una luz WiFi — siempre se
    comanda desde Home Assistant, así que da igual cuál sea.

    REQUISITO previo, una vez por tecla satélite: poner su role en "three_way"
    (control "Button N role" en z2m). Eso desacopla la tecla de su relé y deja
    el LED en manos de Home Assistant.
  domain: automation
  input:
    luz_principal:
      name: Luz principal
      description: La luz que se prende y apaga de verdad.
      selector:
        entity:
          domain: [light, switch]

    botones:
      name: Teclas
      description: >-
        Los sensores "press action" de todas las teclas que manejan esta luz.
        El LED de cada una se deduce solo (button_1 → l1, button_2 → l2, …), no
        hay que elegirlo.
      selector:
        entity:
          domain: [sensor]
          multiple: true

    crear_binding:
      name: Binding directo Zigbee (opcional)
      description: >-
        Si se activa, cada tecla queda bindeada al relé de la luz principal, y
        la enciende sin pasar por Home Assistant (~40 ms en vez de ~300, y
        sigue andando con HA caído).

        Solo sirve si la luz principal es un relé Zigbee: con una luz WiFi no
        hay a qué bindear y se ignora solo.

        CONTRA: el binding vive en el equipo, no acá. Si después sacás una tecla
        de esta lista o borrás la automatización, ese binding QUEDA y esa tecla
        va a seguir comandando la luz sin que nada en HA lo explique. Hay que
        borrarlo a mano en la pestaña Vincular de z2m.
      default: false
      selector:
        boolean:

    backstop:
      name: Reintento periódico
      description: >-
        Cada cuánto se reescriben los LEDs aunque nada haya cambiado. Es la red
        de seguridad: sin esto, un mensaje perdido deja un LED mal para siempre.
      default: "/5"
      selector:
        select:
          options:
            - { label: cada minuto, value: "/1" }
            - { label: cada 5 minutos, value: "/5" }
            - { label: cada 15 minutos, value: "/15" }
            - { label: cada 30 minutos, value: "/30" }

# queued: dos apretones seguidos se atienden en orden en vez de descartarse.
mode: queued
max: 10

variables:
  luz: !input luz_principal
  botones: !input botones
  crear_binding: !input crear_binding

trigger:
  # "press" lo emite un pulsador momentáneo; "position_on"/"position_off" una
  # tecla de posición mantenida, donde subirla y bajarla son dos acciones
  # distintas. "released" NO está: es el final de un apretón, no uno nuevo.
  - platform: state
    entity_id: !input botones
    to: ["press", "position_on", "position_off"]
    id: apreton

  - platform: state
    entity_id: !input luz_principal
    to: ["on", "off"]
    id: sincronizar

  - platform: time_pattern
    minutes: !input backstop
    id: sincronizar

  - platform: homeassistant
    event: start
    id: sincronizar

  # Re-aplicar bindings. Al arrancar HA, y cada vez que z2m termina de
  # interviewar un equipo: eso es lo que pasa después de un factory reset, que
  # es justo cuando el equipo perdió sus bindings.
  - platform: homeassistant
    event: start
    id: bindear

  - platform: mqtt
    topic: zigbee2mqtt/bridge/event
    # Solo cuando un equipo TERMINA de interviewar. Ese tópico lleva de todo
    # (device_joined, device_leave, cada anuncio); sin filtrar, re-bindearía
    # toda la casa a cada rato.
    value_template: "{{ value_json.type }}|{{ value_json.data.status | default('') }}"
    payload: "device_interview|successful"
    id: bindear

  - platform: time_pattern
    hours: "/6"
    id: bindear

  # La respuesta de z2m a cada bind. Sin esto solo sabíamos lo que mandamos,
  # no lo que pasó con el pedido: un bind rechazado se veía igual que uno que
  # funcionó, salvo yendo a mirar el log de z2m a mano.
  - platform: mqtt
    topic: zigbee2mqtt/bridge/response/device/bind
    id: bind_respuesta

action:
  - choose:
      # La tecla no decide el valor: le pide a HA que invierta el estado REAL de
      # la luz. Si el LED de esa tecla quedó viejo, el apretón sale bien igual.
      #
      # UN SOLO actor por luz. Con el binding encendido el relé ya recibió el
      # comando directo de la tecla; si HA mandara además el suyo serían dos
      # toggles por apretón y la luz quedaría como estaba, de forma intermitente
      # según cuál llegue primero. Con binding, HA solo escribe los LEDs.
      - conditions:
          - condition: trigger
            id: apreton
          - condition: template
            value_template: "{{ not crear_binding }}"
        sequence:
          - service: homeassistant.toggle
            target:
              entity_id: !input luz_principal

      # Los LEDs siguen a la luz, sin importar quién la cambió: una tecla, la
      # app, o una automatización.
      - conditions:
          - condition: trigger
            id: sincronizar
        sequence:
          # Se calcula ACÁ y no en el bloque variables de arriba a propósito:
          # ese se evalúa en cada ejecución, así que un fallo deducindo LEDs
          # abortaba también el camino del apretón y la luz no se prendía. Un
          # LED que no se encuentra no debe poder romper el encendido.
          - variables:
              # El LED de cada tecla vive en el relé emparejado, en el MISMO
              # equipo: button_2 -> l2_indicator. Se deduce en vez de pedirlo
              # porque es mecánico, y elegirlo a mano cuarenta veces es donde
              # se cuelan los errores.
              leds: >-
                {% set ns = namespace(l=[]) %}
                {% for b in botones %}
                  {% set d = device_id(b) %}
                  {% if d %}
                    {% set n = b | regex_findall('button_(\d+)') | first | default('', true) %}
                    {% if n %}
                      {% set hit = device_entities(d)
                                   | select('search', '_l' ~ n ~ '_indicator')
                                   | list %}
                      {% if hit %}{% set ns.l = ns.l + [hit[0]] %}{% endif %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.l }}

          - condition: template
            value_template: "{{ leds | count > 0 }}"

          - service: >-
              {{ 'switch.turn_on' if is_state(luz, 'on') else 'switch.turn_off' }}
            target:
              entity_id: "{{ leds }}"

  # Binding directo, FUERA del choose a propósito: así una corrida manual
  # ("Ejecutar") también lo aplica. Probar una automatización es ejecutarla a
  # mano, y en una corrida manual no hay trigger, así que ninguna rama del
  # choose matchea y no pasaría nada.
  # Un bind que falla tiene que decirlo. Solo cuando falla: si sale bien no
  # hace falta enterarse cada seis horas.
  - if:
      - condition: template
        value_template: >-
          {{ trigger.id | default('') == 'bind_respuesta'
             and (trigger.payload_json.status | default('')) != 'ok' }}
    then:
      # Acotado a los equipos de ESTA luz: el tópico es global, así que sin
      # filtrar un solo bind fallido avisaría una vez por automatización.
      - variables:
          mios: >-
            {% set ns = namespace(l=[device_attr(luz, 'name') or '']) %}
            {% for b in botones %}
              {% set ns.l = ns.l + [device_attr(b, 'name') or ''] %}
            {% endfor %}
            {{ ns.l | reject('eq', '') | list }}
      - condition: template
        value_template: >-
          {{ mios | select('in', trigger.payload) | list | count > 0 }}
      - service: persistent_notification.create
        data:
          title: 3-way - z2m rechazó el bind
          message: "{{ trigger.payload }}"
      - stop: "Respuesta de bind reportada"

  - variables:
      # Tres formas, porque Home Assistant no es consistente entre versiones:
      # en una corrida manual `trigger` puede no existir, existir en None, o
      # existir sin id. Cualquiera de las tres es "la ejecutó una persona".
      es_manual: >-
        {{ trigger is not defined or trigger is none or trigger.id is not defined }}

  - if:
      - condition: template
        value_template: >-
          {{ crear_binding and (es_manual or trigger.id == 'bindear') }}
    then:
      - variables:
          # El nombre del dispositivo en HA es el friendly_name que publicó
          # z2m, así que coinciden. Se resuelve en cada corrida: si mañana
          # renombran el switch, el binding se sigue recreando bien.
          nombre_luz: "{{ device_attr(luz, 'name') or '' }}"

          # Cuántos gangs tiene el equipo, CONTANDO sus relés en vez de leerlo
          # de un nombre de modelo: Home Assistant guarda en "model" la
          # descripción del converter, no su model, y ese texto no tiene
          # formato garantizado. Las entidades sí son un dato duro -- un equipo
          # con l1/l2/l3 tiene tres gangs.
          #
          # Hace falta porque el endpoint del relé depende del modelo: los
          # endpoints son 1..N para botones y N+1..2N para relés, así que l1 es
          # el 2 en un 1-gang y el 4 en un 3-gang.
          gangs_luz: >-
            {% set ns = namespace(v=[]) %}
            {% for e in device_entities(device_id(luz)) %}
              {% for n in e | regex_findall('_l(\d+)') %}
                {% if n not in ns.v %}{% set ns.v = ns.v + [n] %}{% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.v | count }}
          idx_luz: >-
            {{ luz | regex_findall('_l(\d+)') | last | default(0, true) | int }}

      - variables:
          # Endpoint del relé = cantidad de gangs + número de la luz.
          ep_luz: >-
            {{ (gangs_luz | int + idx_luz | int) if (gangs_luz | int > 0 and idx_luz | int > 0) else 0 }}
          pares: >-
            {% set ns = namespace(l=[]) %}
            {% if nombre_luz and gangs_luz | int > 0 and idx_luz | int > 0 %}
              {% for b in botones %}
                {% set nb = device_attr(b, 'name') or '' %}
                {# El botón sí es directo: button_2 es el endpoint 2. #}
                {% set ep = b | regex_findall('_button_(\d+)') | first | default(0, true) | int %}
                {% if nb and ep > 0 and nb != nombre_luz %}
                  {% set ns.l = ns.l + [{'nombre': nb, 'ep': ep}] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.l }}

      - condition: template
        value_template: "{{ pares | count > 0 }}"

      - repeat:
          for_each: "{{ pares }}"
          sequence:
            # Los endpoints van en SUS PROPIOS campos. Pegarlos al nombre
            # con una barra hace que z2m busque un dispositivo llamado
            # "Pasillo/1" y responda que no existe.
            - service: mqtt.publish
              data:
                topic: zigbee2mqtt/bridge/request/device/bind
                payload: >-
                  {{ {'from': repeat.item.nombre,
                      'from_endpoint': repeat.item.ep,
                      'to': nombre_luz,
                      'to_endpoint': ep_luz,
                      'clusters': ['genOnOff']} | to_json }}

            # Espaciado: con varias luces configuradas, todas re-bindean en el
            # mismo arranque de HA y conviene no disparar todo junto.
            - delay: "00:00:02"
