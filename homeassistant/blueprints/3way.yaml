blueprint:
  name: 3-way — una luz desde varias teclas
  description: >-
    Varias teclas manejan la misma luz, y el LED de cada una refleja el estado
    real de esa luz.

    Una automatización por LUZ, no por tecla: se eligen todas las teclas juntas.
    La luz principal puede ser un relé Zigbee o una luz WiFi — siempre se
    comanda desde Home Assistant, así que da igual cuál sea.

    REQUISITO previo, una vez por tecla satélite: poner su role en "three_way"
    (control "Button N role" en z2m). Eso desacopla la tecla de su relé y deja
    el LED en manos de Home Assistant.
  domain: automation
  input:
    luz_principal:
      name: Luz principal
      description: La luz que se prende y apaga de verdad.
      selector:
        entity:
          domain: [light, switch]

    botones:
      name: Teclas
      description: >-
        Los sensores "press action" de todas las teclas que manejan esta luz.
        El LED de cada una se deduce solo (button_1 → l1, button_2 → l2, …), no
        hay que elegirlo.
      selector:
        entity:
          domain: [sensor]
          multiple: true

    backstop:
      name: Reintento periódico
      description: >-
        Cada cuánto se reescriben los LEDs aunque nada haya cambiado. Es la red
        de seguridad: sin esto, un mensaje perdido deja un LED mal para siempre.
      default: "/5"
      selector:
        select:
          options:
            - { label: cada minuto, value: "/1" }
            - { label: cada 5 minutos, value: "/5" }
            - { label: cada 15 minutos, value: "/15" }
            - { label: cada 30 minutos, value: "/30" }

# queued: dos apretones seguidos se atienden en orden en vez de descartarse.
mode: queued
max: 10

variables:
  luz: !input luz_principal
  botones: !input botones
  # El LED de cada tecla vive en el relé emparejado, en el MISMO equipo:
  # button_2 -> l2_indicator. Se deduce en vez de pedirlo porque es mecánico y
  # elegirlo a mano, cuarenta veces, es donde se cuelan los errores.
  leds: >-
    {% set ns = namespace(l=[]) %}
    {% for b in botones %}
      {% set n = b | regex_findall('button_(\d+)') | first | default('', true) %}
      {% if n %}
        {% set hit = device_entities(device_id(b))
                     | select('search', '_l' ~ n ~ '_indicator')
                     | list %}
        {% if hit %}{% set ns.l = ns.l + [hit[0]] %}{% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.l }}

trigger:
  # "press" lo emite un pulsador momentáneo; "position_on"/"position_off" una
  # tecla de posición mantenida, donde subirla y bajarla son dos acciones
  # distintas. "released" NO está: es el final de un apretón, no uno nuevo.
  - platform: state
    entity_id: !input botones
    to: ["press", "position_on", "position_off"]
    id: apreton

  - platform: state
    entity_id: !input luz_principal
    to: ["on", "off"]
    id: sincronizar

  - platform: time_pattern
    minutes: !input backstop
    id: sincronizar

  - platform: homeassistant
    event: start
    id: sincronizar

action:
  - choose:
      # La tecla no decide el valor: le pide a HA que invierta el estado REAL de
      # la luz. Si el LED de esa tecla quedó viejo, el apretón sale bien igual.
      - conditions:
          - condition: trigger
            id: apreton
        sequence:
          - service: homeassistant.toggle
            target:
              entity_id: !input luz_principal

      # Los LEDs siguen a la luz, sin importar quién la cambió: una tecla, la
      # app, o una automatización.
      - conditions:
          - condition: trigger
            id: sincronizar
        sequence:
          - service: >-
              {{ 'switch.turn_on' if is_state(luz, 'on') else 'switch.turn_off' }}
            target:
              entity_id: "{{ leds }}"
